    <!-- CSS BLOB ANIMATIONS, GRADIENTS & NOISE -->
    <style>
        :root {
            /* This is the master color that JS will update instantly */
            --team-color: #F97316; 
        }
        
        @keyframes drift1 {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -40px) scale(1.1); }
            66% { transform: translate(-20px, 30px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        
        @keyframes drift2 {
            0% { transform: translate(0px, 0px) scale(1); }
            50% { transform: translate(-40px, 20px) scale(0.85); }
            100% { transform: translate(0px, 0px) scale(1); }
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(45px); /* Reduced blur so they don't wash out entirely */
            opacity: 0.6;
            transition: --team-color 1s ease-in-out;
        }

        /* Blob 1: The main aura */
        .blob-1 {
            background: radial-gradient(circle at center, var(--team-color) 0%, transparent 70%);
            width: 400px; height: 400px;
            top: -5%; left: -10%;
            animation: drift1 8s infinite ease-in-out;
        }

        /* Blob 2: The "hotspot" core (white center fading to team color) */
        .blob-2 {
            background: radial-gradient(circle at center, rgba(255,255,255,0.8) 0%, var(--team-color) 35%, transparent 75%);
            width: 300px; height: 300px;
            top: 20%; right: -10%;
            animation: drift2 6s infinite ease-in-out;
            opacity: 0.8;
        }

        /* Blob 3: A supporting bottom highlight */
        .blob-3 {
            background: radial-gradient(circle at center, var(--team-color) 0%, transparent 65%);
            width: 350px; height: 350px;
            bottom: -5%; left: 15%;
            animation: drift1 10s infinite ease-in-out reverse;
        }
        
        /* Dark mode tweaks for the blobs so they stay vibrant */
        .dark .blob { opacity: 0.4; }
        .dark .blob-2 { background: radial-gradient(circle at center, rgba(255,255,255,0.4) 0%, var(--team-color) 40%, transparent 75%); }
    </style>

            const profit = decimal - 1;
            if (profit <= 0) return "1/1"; 
            let numerator = Math.round(profit * 100);
            let denominator = 100;
            function gcd(a, b) { return b ? gcd(b, a % b) : a; }
            const commonDivisor = gcd(numerator, denominator);
            return `${numerator / commonDivisor}/${denominator / commonDivisor}`;

        function init() {
            renderTabs();
            renderFeeds();
        }

        function renderTabs() {
            const tabsContainer = document.getElementById('sport-tabs');
            tabsContainer.innerHTML = sportsList.map(sport => {
                const isActive = sport === currentSport;
                const baseClass = "sport-tab shrink-0 flex items-center space-x-2 px-6 py-3 font-bold text-sm transition-colors cursor-pointer border-r border-gray-100 dark:border-gray-800";
                const activeClass = isActive ? "bg-brand text-white" : "bg-transparent text-gray-600 dark:text-gray-400";
                const iconFilter = isActive ? "brightness-0 invert" : "grayscale opacity-70";
                return `
                    <button onclick="changeSport('${sport}')" class="${baseClass} ${activeClass}">
                        <img src="icon-${sport.toLowerCase()}.svg" alt="${sport}" class="w-4 h-4 ${iconFilter}">
                        <span>${sport}</span>
                    </button>
                `;
            }).join('');
        }

        function changeSport(sport) {
            currentSport = sport;
            renderTabs();
            renderFeeds();
        }

                            </div>

                            </div>
                        </div>
                        <div class="flex flex-col items-center space-y-3">

                                <span class="text-[10px] font-bold mt-1 like-count">${Math.floor(Math.random() * 150) + 12}</span>
                            </button>
                            <button onclick="placeBet(this)" data-id="${fixture.id}-${sel.name}" data-match-id="${fixture.id}" data-selection="${sel.name}" data-match="${fixture.match}" data-odds="${sel.odds}" class="bet-btn w-14 bg-brand text-white h-14 rounded-full flex flex-col items-center justify-center shadow-md shadow-orange-200 transition-all">
                                <span class="text-xl leading-none bet-icon-inner">&#128184;</span>
                                <span class="text-[10px] font-bold mt-1 bet-text-inner">&pound;1 bet</span>
                            </button>
                        </div>
                    </div>
                </div>`;
            }).join('');

            trFeed.innerHTML = filtered.map(fixture => {
                const buttonsHtml = fixture.selections.map(sel => `
                    <button onclick="placeBet(this)" data-id="${fixture.id}-${sel.name}" data-match-id="${fixture.id}" data-selection="${sel.name}" data-match="${fixture.match}" data-odds="${sel.odds}" class="bet-btn flex-1 bg-white/80 dark:bg-gray-800/80 backdrop-blur-sm text-gray-800 dark:text-white flex flex-col items-center justify-center h-16 rounded-xl transition-all border border-gray-100 dark:border-gray-700 shadow-sm">
                        <span class="text-[10px] font-bold text-gray-400 bet-text-inner">${sel.name}</span>
                        <span class="text-lg font-black bet-odds-inner">${getFraction(sel.odds)}</span>
                    </button>
                `).join('');
                return `
                <div class="p-4 border-b border-gray-100/50 dark:border-gray-800/50 bg-white/40 dark:bg-gray-900/40 backdrop-blur-md transition-colors duration-300">
                    <div class="flex justify-between items-center text-xs text-gray-500 mb-4 font-semibold">
                        <span>${fixture.league}</span>
                        <span>${fixture.time}</span>
                    </div>
                    <div class="flex justify-center items-center px-2 font-bold text-lg mb-4 text-gray-900 dark:text-gray-100">
                        <span class="text-center w-full text-sm">${fixture.match}</span>
                    </div>
                    <div class="flex justify-center space-x-2 w-full">
                        ${buttonsHtml}
                    </div>
                </div>`;
            }).join('');

            bets.forEach(bet => {
                document.querySelectorAll(`[data-id="${bet.id}"]`).forEach(btn => updateButtonUI(btn, true));
            });

            // Observer now directly updates the CSS variable, instantly coloring all blobs
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const newColor = entry.target.getAttribute('data-color') || '#F97316';
                        document.documentElement.style.setProperty('--team-color', newColor);
                    }
                });
            }, { threshold: 0.6 });
            
            document.querySelectorAll('.tiktok-card').forEach(card => observer.observe(card));
        }

        function updateIndicator() {
            const wrapper = document.getElementById('feed-wrapper');
            const dotLeft = document.getElementById('dot-left');
            const dotRight = document.getElementById('dot-right');
            
            if (wrapper.scrollLeft > (wrapper.clientWidth / 2)) {
                dotLeft.className = "w-1.5 h-1.5 bg-gray-300 dark:bg-gray-700 rounded-full transition-all duration-300";
                dotRight.className = "w-4 h-1.5 bg-brand rounded-full transition-all duration-300";
            } else {
                dotLeft.className = "w-4 h-1.5 bg-brand rounded-full transition-all duration-300";
                dotRight.className = "w-1.5 h-1.5 bg-gray-300 dark:bg-gray-700 rounded-full transition-all duration-300";
            }
        }

        function toggleLike(btn) {
            const isLiked = btn.classList.contains('liked');
            const countSpan = btn.querySelector('.like-count');
            let count = parseInt(countSpan.innerText);
            if (isLiked) {
                btn.classList.remove('liked', 'text-orange-500', 'bg-orange-50', 'border', 'border-orange-200');
                btn.classList.add('text-gray-400', 'bg-gray-50/80', 'dark:bg-gray-800/80');
                countSpan.innerText = count - 1;
            } else {
                btn.classList.add('liked', 'text-orange-500', 'bg-orange-50', 'border', 'border-orange-200');
                btn.classList.remove('text-gray-400', 'bg-gray-50/80', 'dark:bg-gray-800/80');
                countSpan.innerText = count + 1;
            }
        }

        function toggleSlip() {
            document.getElementById('expanded-slip').classList.toggle('translate-y-full');
        }

        function placeBet(btn) {
            const id = btn.getAttribute('data-id');
            const matchId = btn.getAttribute('data-match-id');
            const selection = btn.getAttribute('data-selection');
            const match = btn.getAttribute('data-match');
            const odds = parseFloat(btn.getAttribute('data-odds'));

            if (bets.some(b => b.id === id)) {
                removeBet(id);
                return;
            }
            const existingMatchBet = bets.find(b => b.matchId === matchId);
            if (existingMatchBet) {
                removeBet(existingMatchBet.id);
            }

            bets.push({ id, matchId, selection, match, odds });
            document.querySelectorAll(`[data-id="${id}"]`).forEach(el => updateButtonUI(el, true));
            renderSlip();
        }

        function removeBet(id) {
            bets = bets.filter(b => b.id !== id);
            document.querySelectorAll(`[data-id="${id}"]`).forEach(el => updateButtonUI(el, false));
            renderSlip();
        }

        function clearSlip() {
            bets.forEach(bet => {
                document.querySelectorAll(`[data-id="${bet.id}"]`).forEach(el => updateButtonUI(el, false));
            });
            bets = [];
            renderSlip();
            toggleSlip();
        }

        function updateButtonUI(btn, isPlaced) {
            const isTikTok = btn.classList.contains('w-14'); 
            const selectionText = btn.getAttribute('data-selection');
            const oddsValue = getFraction(parseFloat(btn.getAttribute('data-odds')));

            if (isPlaced) {
                btn.classList.add('placed');
                if (isTikTok) {
                    btn.className = "bet-btn w-14 placed bg-gray-100 dark:bg-gray-800 text-gray-800 dark:text-gray-300 h-14 rounded-full flex flex-col items-center justify-center transition-all";
                    btn.innerHTML = `<span class="text-xl leading-none font-light">&#10003;</span><span class="text-[10px] font-bold mt-1 text-gray-400">Placed</span>`;
                } else {
                    btn.className = "bet-btn flex-1 placed bg-brand text-white flex flex-col items-center justify-center h-16 rounded-xl transition-all shadow-md";
                    btn.innerHTML = `<span class="text-[10px] font-bold text-orange-200">${selectionText}</span><span class="text-lg font-black">&#10003;</span>`;
                }
            } else {
                btn.classList.remove('placed');
                if (isTikTok) {
                    btn.className = "bet-btn w-14 bg-brand text-white h-14 rounded-full flex flex-col items-center justify-center shadow-md shadow-orange-200 transition-all";
                    btn.innerHTML = `<span class="text-xl leading-none bet-icon-inner">&#128184;</span><span class="text-[10px] font-bold mt-1 bet-text-inner">&pound;1 bet</span>`;
                } else {
                    btn.className = "bet-btn flex-1 bg-white/80 dark:bg-gray-800/80 backdrop-blur-sm text-gray-800 dark:text-white flex flex-col items-center justify-center h-16 rounded-xl transition-all border border-gray-100 dark:border-gray-700 shadow-sm";
                    btn.innerHTML = `<span class="text-[10px] font-bold text-gray-400 bet-text-inner">${selectionText}</span><span class="text-lg font-black bet-odds-inner">${oddsValue}</span>`;
                }
            }
        }

        function renderSlip() {
            const container = document.getElementById('slip-bets-container');
            const accaBlock = document.getElementById('acca-block');
            const numBets = bets.length;
            
            let singlesStake = numBets * 1.00;
            let hasAcca = numBets > 1;
            let accaStake = hasAcca ? 1.00 : 0;
            let accaOdds = hasAcca ? bets.reduce((prod, b) => prod * b.odds, 1) : 0;
            let accaReturns = accaOdds * accaStake;
            
            let totalStake = singlesStake + accaStake;
            let totalReturns = (bets.reduce((sum, b) => sum + (b.odds * 1.00), 0)) + accaReturns;

            document.getElementById('collapsed-count').innerText = numBets;
            document.getElementById('expanded-count').innerText = numBets;
            
            const headerText = `&pound;${totalStake.toFixed(2)} &middot; Returns &pound;${totalReturns.toFixed(2)}`;
            document.getElementById('collapsed-returns').innerHTML = headerText;
            document.getElementById('expanded-header-returns').innerHTML = headerText;
            document.getElementById('total-stake-text').innerHTML = `&pound;${totalStake.toFixed(2)}`;
            document.getElementById('place-btn-stake').innerHTML = `&pound;${totalStake.toFixed(2)}`;

            container.innerHTML = bets.map(bet => `
                <div class="flex justify-between items-center py-2 border-b border-gray-50 dark:border-gray-800">
                    <div class="flex-1">
                        <div class="font-bold text-gray-900 dark:text-white">${bet.selection}</div>
                        <div class="text-[10px] text-gray-400 mt-0.5">${bet.match}</div>
                    </div>
                    <div class="text-right flex items-center space-x-3">
                        <div>
                            <div class="font-black text-gray-900 dark:text-white">${getFraction(bet.odds)}</div>
                            <div class="text-[10px] text-gray-400 mt-0.5">&pound;1 stake</div>
                        </div>
                        <button onclick="removeBet('${bet.id}')" class="text-gray-300 dark:text-gray-600 text-lg font-light hover:text-red-400">&times;</button>
                    </div>
                </div>
            `).join('');

            if (hasAcca) {
                accaBlock.classList.remove('hidden');
                accaBlock.classList.add('flex');
                document.getElementById('acca-title').innerText = `${numBets}-fold Accumulator`;
                document.getElementById('acca-odds').innerText = getFraction(accaOdds);
                document.getElementById('acca-returns').innerHTML = `Returns &pound;${accaReturns.toFixed(2)}`;
            } else {
                accaBlock.classList.add('hidden');
                accaBlock.classList.remove('flex');
            }
        }

        init();
    </script>
</body>
</html>
