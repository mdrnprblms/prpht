<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>prpht - Micro-Stakes</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Nunito', 'sans-serif'] },
                    colors: { brand: '#F97316' }
                }
            }
        }
    </script>
</head>
<body class="bg-white text-gray-900 font-sans h-screen flex flex-col relative overflow-hidden">

    <header class="flex justify-between items-center p-4 border-b border-gray-100 w-full shrink-0">
        <div class="flex-1 flex items-center justify-start">
            <span class="text-xs text-gray-400 font-bold tracking-widest uppercase">Micro-Stakes</span>
        </div>
        <div class="flex-none flex justify-center">
            <img src="logo.svg" alt="prpht" class="h-6" onerror="this.outerHTML='<span class=\'font-black text-brand text-xl\'>prpht</span>'">
        </div>
        <div class="flex-1 flex justify-end flex-col items-end">
            <span class="text-[10px] text-gray-400 font-bold uppercase leading-none">Balance</span>
            <span class="text-xs leading-none">&pound;550.00</span>
        </div>
    </header>

    <div id="sport-tabs" class="flex overflow-x-auto border-b border-gray-100 hide-scrollbar no-scrollbar whitespace-nowrap shrink-0">
        </div>

    <div class="bg-[#FFF8F0] text-[#E85D04] text-xs font-semibold p-3 flex items-center space-x-2 border-b border-[#FFE5D0] shrink-0">
        <span class="w-1.5 h-1.5 bg-[#E85D04] rounded-full inline-block shrink-0"></span>
        <span class="truncate">All bets fixed at &pound;1. You can never lose more than one pound per bet.</span>
    </div>

    <div class="flex-1 flex w-full overflow-x-auto snap-x snap-mandatory no-scrollbar relative" id="feed-wrapper" onscroll="updateIndicator()">
        
        <main id="tiktok-feed" class="w-full shrink-0 h-full overflow-y-auto snap-y snap-mandatory pb-24 no-scrollbar snap-center relative">
            </main>

        <main id="traditional-feed" class="w-full shrink-0 h-full overflow-y-auto pb-24 snap-center relative">
            </main>
    </div>

    <div class="absolute bottom-20 w-full flex justify-center space-x-1.5 pb-2 pointer-events-none z-10" id="indicator-dots">
        <div class="w-4 h-1.5 bg-brand rounded-full transition-all duration-300" id="dot-left"></div>
        <div class="w-1.5 h-1.5 bg-gray-300 rounded-full transition-all duration-300" id="dot-right"></div>
    </div>

    <div onclick="toggleSlip()" class="absolute bottom-0 w-full bg-brand text-white p-4 rounded-t-2xl shadow-[0_-4px_20px_rgba(0,0,0,0.1)] flex justify-between items-center cursor-pointer z-20">
        <div class="flex items-center space-x-3">
            <div id="collapsed-count" class="bg-white text-brand font-black w-6 h-6 rounded-full flex items-center justify-center text-sm">0</div>
            <span class="font-bold text-lg">Bet Slip</span>
        </div>
        <div class="flex items-center space-x-2">
            <span id="collapsed-returns" class="text-sm font-semibold opacity-90">&pound;0.00 &middot; Returns &pound;0.00</span>
            <span class="text-xl">&uarr;</span>
        </div>
    </div>

    <div id="expanded-slip" class="fixed inset-x-0 bottom-0 z-50 bg-white rounded-t-2xl shadow-[0_-10px_40px_rgba(0,0,0,0.15)] flex flex-col h-[85vh] transform translate-y-full transition-transform duration-300">
        <div onclick="toggleSlip()" class="bg-brand text-white p-4 rounded-t-2xl flex justify-between items-center cursor-pointer shrink-0">
            <div class="flex items-center space-x-3">
                <div id="expanded-count" class="bg-white text-brand font-black w-6 h-6 rounded-full flex items-center justify-center text-sm">0</div>
                <span class="font-bold text-lg">Bet Slip</span>
            </div>
            <div class="flex items-center space-x-2">
                <span id="expanded-header-returns" class="text-sm font-semibold opacity-90">&pound;0.00 &middot; Returns &pound;0.00</span>
                <span class="text-xl">&darr;</span>
            </div>
        </div>
        <div class="p-4 overflow-y-auto flex-1 bg-white">
            <div class="flex justify-between items-center mb-4">
                <span class="text-xs font-bold text-gray-500 tracking-wider">SINGLES</span>
                <button onclick="clearSlip()" class="text-brand text-xs font-bold">Clear all</button>
            </div>
            <div id="slip-bets-container" class="space-y-4"></div>
            <div id="acca-block" class="hidden mt-6 border border-brand bg-orange-50 rounded-lg p-3 justify-between items-center">
                <div>
                    <div id="acca-title" class="font-bold text-brand">2-fold Accumulator</div>
                    <div class="text-xs text-orange-400 font-semibold mt-1">&pound;1 stake</div>
                </div>
                <div class="text-right">
                    <div id="acca-odds" class="font-black text-brand text-lg">0.00</div>
                    <div id="acca-returns" class="text-xs text-orange-400 font-semibold mt-1">Returns &pound;0.00</div>
                </div>
            </div>
        </div>
        <div class="p-4 border-t border-gray-100 bg-white shrink-0 pb-8">
            <div class="flex justify-between items-center mb-4">
                <span class="font-bold text-gray-800">Total stake</span>
                <span id="total-stake-text" class="font-black text-lg text-gray-900">&pound;0.00</span>
            </div>
            <button class="w-full bg-brand text-white font-bold py-3.5 rounded-xl text-lg shadow-md">
                Place bets &middot; <span id="place-btn-stake">&pound;0.00</span>
            </button>
            <div class="text-center text-[10px] text-gray-400 mt-3">All stakes fixed at &pound;1. Bet responsibly. 18+.</div>
        </div>
    </div>

    <script>
        // ---------------------------------------------------------

            { id: 'r4', sport: 'Racing', league: 'Aintree', time: '16:00 · Tomorrow', match: 'Grand National', market: 'To Win', selections: [{name: 'CORACH RAMBLER', odds: 6.00}, {name: 'I AM MAXIMUS', odds: 8.00}, {name: 'MEETINGOFTHE', odds: 10.0}], target: 2 },

            // TENNIS (6)
            { id: 't1', sport: 'Tennis', league: 'Wimbledon', time: '13:00 · Wed 30 Jul', match: 'N. Djokovic v C. Alcaraz', market: 'Match Winner', selections: [{name: 'DJOKOVIC', odds: 1.65}, {name: 'ALCARAZ', odds: 2.20}], target: 0 },
            { id: 't2', sport: 'Tennis', league: 'US Open', time: '18:00 · Wed 30 Jul', match: 'J. Sinner v D. Medvedev', market: 'Match Winner', selections: [{name: 'SINNER', odds: 1.80}, {name: 'MEDVEDEV', odds: 2.00}], target: 1 },
            { id: 't3', sport: 'Tennis', league: 'Roland Garros', time: '11:00 · Thu 31 Jul', match: 'I. Swiatek v A. Sabalenka', market: 'Match Winner', selections: [{name: 'SWIATEK', odds: 1.40}, {name: 'SABALENKA', odds: 2.90}], target: 0 },
            { id: 't4', sport: 'Tennis', league: 'Australian Open', time: '09:00 · Thu 31 Jul', match: 'C. Gauff v E. Rybakina', market: 'Match Winner', selections: [{name: 'GAUFF', odds: 2.10}, {name: 'RYBAKINA', odds: 1.70}], target: 1 },
            { id: 't5', sport: 'Tennis', league: 'Miami Open', time: '14:00 · Fri 01 Aug', match: 'A. Zverev v S. Tsitsipas', market: 'Match Winner', selections: [{name: 'ZVEREV', odds: 1.90}, {name: 'TSITSIPAS', odds: 1.90}], target: 0 },
            { id: 't6', sport: 'Tennis', league: 'Indian Wells', time: '16:30 · Fri 01 Aug', match: 'O. Jabeur v J. Pegula', market: 'Match Winner', selections: [{name: 'JABEUR', odds: 2.30}, {name: 'PEGULA', odds: 1.60}], target: 1 },

            // CRICKET (6)
            { id: 'c1', sport: 'Cricket', league: 'The Ashes', time: '11:00 · Wed 30 Jul', match: 'England v Australia', market: 'Match Result', selections: [{name: 'ENG', odds: 2.80}, {name: 'DRAW', odds: 3.20}, {name: 'AUS', odds: 2.20}], target: 1 },
            { id: 'c2', sport: 'Cricket', league: 'T20 World Cup', time: '14:00 · Wed 30 Jul', match: 'India v Pakistan', market: 'Match Winner', selections: [{name: 'IND', odds: 1.60}, {name: 'PAK', odds: 2.30}], target: 0 },
            { id: 'c3', sport: 'Cricket', league: 'IPL', time: '16:00 · Thu 31 Jul', match: 'CSK v Mumbai Indians', market: 'Match Winner', selections: [{name: 'CSK', odds: 1.90}, {name: 'MI', odds: 1.90}], target: 1 },
            { id: 'c4', sport: 'Cricket', league: 'Test Series', time: '09:00 · Fri 01 Aug', match: 'South Africa v New Zealand', market: 'Match Result', selections: [{name: 'RSA', odds: 2.10}, {name: 'DRAW', odds: 4.50}, {name: 'NZ', odds: 2.60}], target: 0 },
            { id: 'c5', sport: 'Cricket', league: 'Big Bash', time: '08:30 · Sat 02 Aug', match: 'Perth Scorchers v Sydney Sixers', market: 'Match Winner', selections: [{name: 'SCO', odds: 1.75}, {name: 'SIX', odds: 2.10}], target: 1 },
            { id: 'c6', sport: 'Cricket', league: 'The Hundred', time: '18:00 · Sun 03 Aug', match: 'Oval Invincibles v London Spirit', market: 'Match Winner', selections: [{name: 'OVAL', odds: 1.85}, {name: 'LON', odds: 1.95}], target: 0 },

            // BASKETBALL (6)
            { id: 'b1', sport: 'Basketball', league: 'NBA', time: '01:30 · Wed 30 Jul', match: 'Lakers v Warriors', market: 'Moneyline', selections: [{name: 'LAL', odds: 2.10}, {name: 'GSW', odds: 1.75}], target: 1 },
            { id: 'b2', sport: 'Basketball', league: 'NBA', time: '02:00 · Wed 30 Jul', match: 'Celtics v Heat', market: 'Moneyline', selections: [{name: 'BOS', odds: 1.50}, {name: 'MIA', odds: 2.60}], target: 0 },
            { id: 'b3', sport: 'Basketball', league: 'EuroLeague', time: '19:30 · Thu 31 Jul', match: 'Real Madrid v Olympiacos', market: 'Moneyline', selections: [{name: 'RMA', odds: 1.65}, {name: 'OLY', odds: 2.25}], target: 0 },
            { id: 'b4', sport: 'Basketball', league: 'NBA', time: '03:00 · Fri 01 Aug', match: 'Nuggets v Suns', market: 'Moneyline', selections: [{name: 'DEN', odds: 1.85}, {name: 'PHX', odds: 1.95}], target: 1 },
            { id: 'b5', sport: 'Basketball', league: 'NBA', time: '04:30 · Sat 02 Aug', match: 'Bucks v 76ers', market: 'Moneyline', selections: [{name: 'MIL', odds: 1.70}, {name: 'PHI', odds: 2.15}], target: 0 },
            { id: 'b6', sport: 'Basketball', league: 'EuroLeague', time: '20:00 · Sun 03 Aug', match: 'Panathinaikos v Monaco', market: 'Moneyline', selections: [{name: 'PAN', odds: 1.90}, {name: 'MON', odds: 1.90}], target: 1 },
        ];

        // ---------------------------------------------------------
        // 2. RENDER ENGINE
        // ---------------------------------------------------------
        function init() {
            renderTabs();
            renderFeeds();
        }

        function renderTabs() {
            const tabsContainer = document.getElementById('sport-tabs');
            tabsContainer.innerHTML = sportsList.map(sport => {
                const isActive = sport === currentSport;
                const baseClass = "sport-tab shrink-0 flex items-center space-x-2 px-6 py-3 font-bold text-sm transition-colors cursor-pointer border-r border-gray-100";
                const activeClass = isActive ? "bg-brand text-white" : "bg-white text-gray-600";
                const iconFilter = isActive ? "brightness-0 invert" : "grayscale opacity-70";
                
                return `
                    <button onclick="changeSport('${sport}')" class="${baseClass} ${activeClass}">
                        <img src="icon-${sport.toLowerCase()}.svg" alt="${sport}" class="w-4 h-4 ${iconFilter}">
                        <span>${sport}</span>
                    </button>
                `;
            }).join('');
        }

        function changeSport(sport) {
            currentSport = sport;
            renderTabs();
            renderFeeds();
        }

        function renderFeeds() {
            const tkFeed = document.getElementById('tiktok-feed');
            const trFeed = document.getElementById('traditional-feed');
            
            const filtered = demoFixtures.filter(f => f.sport === currentSport);
            
            // Build TikTok HTML
            tkFeed.innerHTML = filtered.map(fixture => {
                const sel = fixture.selections[fixture.target];
                return `
                <div class="h-full w-full snap-always snap-center flex flex-col justify-between p-6 border-b-8 border-gray-100">
                    <div class="text-center mt-4">
                        <span class="text-xs text-gray font-semibold uppercase tracking-wider">${fixture.market}</span>
                        <div class="text-[10px] text-white mt-1">${fixture.time}</div>
                    </div>
                    <div class="text-center">
                        <h2 class="text-5xl font-black mt-2 text-gray-900 break-words leading-tight">${sel.name}</h2>
                        <span class="text-3xl font-semibold text-gray-400 mt-1">&pound;1 &rarr; <span class="font-black text-[#61AD34]">&pound;${sel.odds.toFixed(2)}</span></span>
                    </div>
                    <div class="flex justify-between items-end mb-4">
                        <div class="flex flex-col">
                            <div class="flex items-baseline space-x-2">
                                <span class="text-brand font-semibold text-2xl tracking-tighter">${sel.odds.toFixed(2)}</span>
                                <span class="text-sm text-gray-400 font-normal">odds</span>
                            </div>
                            <div class="text-left mt-4">
                                <span class="text-LG text-gray-900 font-semibold uppercase tracking-tighter">${fixture.match}</span>
                                <div class="text-sm text-gray-400 mt-1">${fixture.time}</div>
                            </div>
                        </div>
                        <div class="flex flex-col items-center space-y-4">
                            <button onclick="toggleLike(this)" class="bg-gray-50 text-gray-400 w-12 h-12 rounded-full flex flex-col items-center justify-center shadow-sm transition-colors">
                                <span class="text-lg leading-none heart-icon">&hearts;</span>
                                <span class="text-[10px] font-bold mt-1 like-count">${Math.floor(Math.random() * 150) + 12}</span>
                            </button>
                            <button onclick="placeBet(this)" data-id="${fixture.id}-${sel.name}" data-match-id="${fixture.id}" data-selection="${sel.name}" data-match="${fixture.match}" data-odds="${sel.odds}" class="bet-btn w-14 bg-brand text-white h-14 rounded-full flex flex-col items-center justify-center shadow-md shadow-orange-200 transition-all">
                                <span class="text-xl leading-none bet-icon-inner">&#128184;</span>
                                <span class="text-[10px] font-bold mt-1 bet-text-inner">&pound;1 bet</span>
                            </button>
                        </div>
                    </div>
                </div>`;
            }).join('');

            // Build Traditional HTML
            trFeed.innerHTML = filtered.map(fixture => {
                const buttonsHtml = fixture.selections.map(sel => `
                    <button onclick="placeBet(this)" data-id="${fixture.id}-${sel.name}" data-match-id="${fixture.id}" data-selection="${sel.name}" data-match="${fixture.match}" data-odds="${sel.odds}" class="bet-btn flex-1 bg-gray-50 text-gray-800 flex flex-col items-center justify-center h-16 rounded-xl transition-all">
                        <span class="text-[10px] font-bold text-gray-400 bet-text-inner">${sel.name}</span>
                        <span class="text-lg font-black bet-odds-inner">${sel.odds.toFixed(2)}</span>
                    </button>
                `).join('');

                return `
                <div class="p-4 border-b border-gray-100">
                    <div class="flex justify-between items-center text-xs text-gray-400 mb-4 font-semibold">
                        <span>${fixture.league}</span>
                        <span>${fixture.time}</span>
                    </div>
                    <div class="flex justify-center items-center px-2 font-bold text-lg mb-4">
                        <span class="text-center w-full text-sm">${fixture.match}</span>
                    </div>
                    <div class="flex justify-center space-x-2 w-full">
                        ${buttonsHtml}
                    </div>
                </div>`;
            }).join('');

            // Restore UI states for bets that are currently in the betslip
            bets.forEach(bet => {
                document.querySelectorAll(`[data-id="${bet.id}"]`).forEach(btn => updateButtonUI(btn, true));
            });
        }

        // ---------------------------------------------------------
        // 3. INTERACTIVITY & LOGIC
        // ---------------------------------------------------------
        function updateIndicator() {
            const wrapper = document.getElementById('feed-wrapper');
            const dotLeft = document.getElementById('dot-left');
            const dotRight = document.getElementById('dot-right');
            
            if (wrapper.scrollLeft > (wrapper.clientWidth / 2)) {
                dotLeft.className = "w-1.5 h-1.5 bg-gray-300 rounded-full transition-all duration-300";
                dotRight.className = "w-4 h-1.5 bg-brand rounded-full transition-all duration-300";
            } else {
                dotLeft.className = "w-4 h-1.5 bg-brand rounded-full transition-all duration-300";
                dotRight.className = "w-1.5 h-1.5 bg-gray-300 rounded-full transition-all duration-300";
            }
        }

        function toggleLike(btn) {
            const isLiked = btn.classList.contains('liked');
            const countSpan = btn.querySelector('.like-count');
            let count = parseInt(countSpan.innerText);
            if (isLiked) {
                btn.classList.remove('liked', 'text-orange-500', 'bg-orange-50', 'border', 'border-orange-200');
                btn.classList.add('text-gray-400', 'bg-gray-50');
                countSpan.innerText = count - 1;
            } else {
                btn.classList.add('liked', 'text-orange-500', 'bg-orange-50', 'border', 'border-orange-200');
                btn.classList.remove('text-gray-400', 'bg-gray-50');
                countSpan.innerText = count + 1;
            }
        }

        function toggleSlip() {
            document.getElementById('expanded-slip').classList.toggle('translate-y-full');
        }

        // --- NEW MUTUALLY EXCLUSIVE BET LOGIC ---
        function placeBet(btn) {
            const id = btn.getAttribute('data-id');
            const matchId = btn.getAttribute('data-match-id'); // Unique ID for the fixture
            const selection = btn.getAttribute('data-selection');
            const match = btn.getAttribute('data-match');
            const odds = parseFloat(btn.getAttribute('data-odds'));

            // 1. DESELECT: If this exact bet is already in slip, remove it
            if (bets.some(b => b.id === id)) {
                removeBet(id);
                return;
            }

            // 2. MUTUAL EXCLUSIVITY: If another bet from this match exists, remove it first
            const existingMatchBet = bets.find(b => b.matchId === matchId);
            if (existingMatchBet) {
                removeBet(existingMatchBet.id);
            }

            // 3. Add new bet
            bets.push({ id, matchId, selection, match, odds });
            
            // Update all button UIs that match this exact bet ID
            document.querySelectorAll(`[data-id="${id}"]`).forEach(el => updateButtonUI(el, true));
            renderSlip();
        }

        function removeBet(id) {
            bets = bets.filter(b => b.id !== id);
            // Revert all buttons associated with this bet ID
            document.querySelectorAll(`[data-id="${id}"]`).forEach(el => updateButtonUI(el, false));
            renderSlip();
        }

        function clearSlip() {
            bets.forEach(bet => {
                document.querySelectorAll(`[data-id="${bet.id}"]`).forEach(el => updateButtonUI(el, false));
            });
            bets = [];
            renderSlip();
            toggleSlip();
        }

        function updateButtonUI(btn, isPlaced) {
            const isTikTok = btn.classList.contains('w-14'); 
            const selectionText = btn.getAttribute('data-selection');
            const oddsValue = parseFloat(btn.getAttribute('data-odds')).toFixed(2);

            if (isPlaced) {
                btn.classList.add('placed');
                if (isTikTok) {
                    btn.className = "bet-btn w-14 placed bg-gray-100 text-gray-800 h-14 rounded-full flex flex-col items-center justify-center transition-all";
                    btn.innerHTML = `<span class="text-xl leading-none font-light">&#10003;</span><span class="text-[10px] font-bold mt-1 text-gray-400">Placed</span>`;
                } else {
                    btn.className = "bet-btn flex-1 placed bg-brand text-white flex flex-col items-center justify-center h-16 rounded-xl transition-all shadow-md";
                    btn.innerHTML = `<span class="text-[10px] font-bold text-orange-200">${selectionText}</span><span class="text-lg font-black">&#10003;</span>`;
                }
            } else {
                btn.classList.remove('placed');
                if (isTikTok) {
                    btn.className = "bet-btn w-14 bg-brand text-white h-14 rounded-full flex flex-col items-center justify-center shadow-md shadow-orange-200 transition-all";
                    btn.innerHTML = `<span class="text-xl leading-none bet-icon-inner">&#128184;</span><span class="text-[10px] font-bold mt-1 bet-text-inner">&pound;1 bet</span>`;
                } else {
                    btn.className = "bet-btn flex-1 bg-gray-50 text-gray-800 flex flex-col items-center justify-center h-16 rounded-xl transition-all";
                    btn.innerHTML = `<span class="text-[10px] font-bold text-gray-400 bet-text-inner">${selectionText}</span><span class="text-lg font-black bet-odds-inner">${oddsValue}</span>`;
                }
            }
        }

        function renderSlip() {
            const container = document.getElementById('slip-bets-container');
            const accaBlock = document.getElementById('acca-block');
            const numBets = bets.length;
            
            let singlesStake = numBets * 1.00;
            let hasAcca = numBets > 1;
            let accaStake = hasAcca ? 1.00 : 0;
            let accaOdds = hasAcca ? bets.reduce((prod, b) => prod * b.odds, 1) : 0;
            let accaReturns = accaOdds * accaStake;
            
            let totalStake = singlesStake + accaStake;
            let totalReturns = (bets.reduce((sum, b) => sum + (b.odds * 1.00), 0)) + accaReturns;

            document.getElementById('collapsed-count').innerText = numBets;
            document.getElementById('expanded-count').innerText = numBets;
            
            const headerText = `&pound;${totalStake.toFixed(2)} &middot; Returns &pound;${totalReturns.toFixed(2)}`;
            document.getElementById('collapsed-returns').innerHTML = headerText;
            document.getElementById('expanded-header-returns').innerHTML = headerText;

            document.getElementById('total-stake-text').innerHTML = `&pound;${totalStake.toFixed(2)}`;
            document.getElementById('place-btn-stake').innerHTML = `&pound;${totalStake.toFixed(2)}`;

            container.innerHTML = bets.map(bet => `
                <div class="flex justify-between items-center py-2 border-b border-gray-50">
                    <div class="flex-1">
                        <div class="font-bold text-gray-900">${bet.selection}</div>
                        <div class="text-[10px] text-gray-400 mt-0.5">${bet.match}</div>
                    </div>
                    <div class="text-right flex items-center space-x-3">
                        <div>
                            <div class="font-black text-gray-900">${bet.odds.toFixed(2)}</div>
                            <div class="text-[10px] text-gray-400 mt-0.5">&pound;1 stake</div>
                        </div>
                        <button onclick="removeBet('${bet.id}')" class="text-gray-300 text-lg font-light hover:text-red-400">&times;</button>
                    </div>
                </div>
            `).join('');

            if (hasAcca) {
                accaBlock.classList.remove('hidden');
                accaBlock.classList.add('flex');
                document.getElementById('acca-title').innerText = `${numBets}-fold Accumulator`;
                document.getElementById('acca-odds').innerText = accaOdds.toFixed(2);
                document.getElementById('acca-returns').innerHTML = `Returns &pound;${accaReturns.toFixed(2)}`;
            } else {
                accaBlock.classList.add('hidden');
                accaBlock.classList.remove('flex');
            }
        }

        // Boot up the engine on load
        init();
    </script>
</body>
</html>
