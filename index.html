<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>prpht</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zalando+Sans+Expanded:wght@300;600;900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Zalando Sans Expanded', 'sans-serif'] },
                    colors: { brand: '#A6BE47' }
                }
            }
        }
    </script>
    
    <style>
        @property --team-color {
            syntax: '<color>';
            initial-value: #A6BE47;
            inherits: true;
        }

        :root {
            --team-color: #A6BE47;
            --bg-blur: 6px;
            --bg-grain-light: 0.18;
            --bg-grain-dark: 0.085;
            --bg-grain-blend: normal;
        }

        #blob-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            filter: blur(var(--bg-blur));
            transform: scale(1.15);
        }

        #bg-grain {
            position: absolute;
            inset: 0;
            opacity: var(--bg-grain-light);
            mix-blend-mode: var(--bg-grain-blend);
            pointer-events: none;
        }

        html.dark #bg-grain {
            opacity: var(--bg-grain-dark);
        }

        html:not(.dark) .text-brand {
            color: #3E5210;
        }
    </style>
</head>
<body class="bg-[#FCF4F6] dark:bg-[#040403] text-gray-900 dark:text-gray-100 font-sans h-screen w-screen flex flex-col items-center justify-center relative overflow-hidden transition-colors duration-300">

    <!-- ORGANIC BLOB BACKGROUND & GRAIN OVERLAY -->
    <div class="fixed inset-0 w-full h-full overflow-hidden pointer-events-none -z-10">
        <canvas id="blob-canvas"></canvas>
        <div id="bg-grain"></div>
    </div>

    <!-- CENTERED LANDING CONTENT -->
    <main class="flex flex-col items-center justify-center px-4 text-center z-10">
        <img 
            src="logo.svg" 
            alt="prpht" 
            class="w-[60vw] h-auto select-none"
            onerror="this.outerHTML='<span class=\'font-black text-brand text-[16vw] leading-none\'>prpht</span>'"
        >
        <p class="mt-8 text-sm sm:text-base font-bold tracking-wide text-gray-900 dark:text-gray-400">
            Enquiries: <a href="mailto:info@prpht.net" class="text-gray-900 dark:text-white font-black hover:text-brand transition-colors">info@prpht.net</a>
        </p>
    </main>

    <script>
        const blobField = (function () {
            const canvas = document.getElementById('blob-canvas');
            const ctx = canvas.getContext('2d');
            const W = 64, H = 132;
            canvas.width = W; canvas.height = H;
            const img = ctx.createImageData(W, H);
            const data = img.data;

            const WASH = [
                [63, 146, 114],    // saturated granite green
                [122, 134, 204],   // saturated lavender blue
                [61, 147, 166],    // saturated pacific cyan
                [138, 164, 224],   // saturated wisteria blue
            ];
            const TEAM = [166, 190, 71]; // #A6BE47 default bright stop
            const target = [WASH[0].slice(), WASH[2].slice(), TEAM.slice()];
            const current = [WASH[0].slice(), WASH[2].slice(), TEAM.slice()];

            const BG_LIGHT = [252, 244, 246];
            const BG_DARK = [4, 4, 3];
            let bg = BG_LIGHT.slice();

            function hash(ix, iy) {
                let n = Math.imul(ix, 0x27d4eb2d) ^ Math.imul(iy, 0x165667b1);
                n = Math.imul(n ^ (n >>> 15), 0x2c1b3c6d);
                n = Math.imul(n ^ (n >>> 12), 0x297a2d39);
                n ^= n >>> 15;
                return (n >>> 0) / 4294967296;
            }
            function fade(t) { return t * t * (3 - 2 * t); }
            function noise2(x, y) {
                const ix = Math.floor(x), iy = Math.floor(y);
                const fx = fade(x - ix), fy = fade(y - iy);
                const a = hash(ix, iy), b = hash(ix + 1, iy);
                const c = hash(ix, iy + 1), d = hash(ix + 1, iy + 1);
                return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
            }
            function fbm(x, y) {
                let v = 0, amp = 0.5, f = 1;
                for (let o = 0; o < 4; o++) { v += amp * noise2(x * f, y * f); f *= 2; amp *= 0.5; }
                return v / 0.9375;
            }
            function smoothstep(e0, e1, x) {
                const t = Math.min(1, Math.max(0, (x - e0) / (e1 - e0)));
                return t * t * (3 - 2 * t);
            }

            function setColor(hex) {
                const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex || '');
                if (m) for (let i = 0; i < 3; i++) target[2][i] = parseInt(m[i + 1], 16);
            }

            function isDark() { return document.documentElement.classList.contains('dark'); }

            function frame(ts) {
                const t = ts * 0.00007;
                for (let s = 0; s < 2; s++) {
                    const ph = (Math.sin(ts * 0.00003 + s * 2.1) + 1) / 2 * (WASH.length - 1);
                    const i0 = Math.floor(ph), i1 = Math.min(i0 + 1, WASH.length - 1), k = ph - i0;
                    for (let i = 0; i < 3; i++) target[s][i] = WASH[i0][i] + (WASH[i1][i] - WASH[i0][i]) * k;
                }
                for (let s = 0; s < 3; s++)
                    for (let i = 0; i < 3; i++) current[s][i] += (target[s][i] - current[s][i]) * 0.05;

                const dark = isDark();
                const want = dark ? BG_DARK : BG_LIGHT;
                for (let i = 0; i < 3; i++) bg[i] += (want[i] - bg[i]) * 0.12;
                const bR = bg[0], bG = bg[1], bB = bg[2];
                const strength = dark ? 0.62 : 0.56;

                let p = 0;
                for (let y = 0; y < H; y++) {
                    const ny = (y / H) * 3.1;
                    for (let x = 0; x < W; x++, p += 4) {
                        const nx = (x / W) * 1.7;
                        const wx = fbm(nx * 1.25 + t, ny * 1.25);
                        const wy = fbm(nx * 1.25 + 4.7, ny * 1.25 - t * 0.85);
                        const v = fbm(nx + wx * 1.9 + t * 0.6, ny + wy * 1.9);

                        const a = smoothstep(0.50, 0.74, v) * strength;
                        if (a > 0) {
                            const tt = smoothstep(0.50, 0.86, v);
                            let r, g, b;
                            if (tt < 0.5) {
                                const k = tt * 2;
                                r = current[0][0] + (current[1][0] - current[0][0]) * k;
                                g = current[0][1] + (current[1][1] - current[0][1]) * k;
                                b = current[0][2] + (current[1][2] - current[0][2]) * k;
                            } else {
                                const k = (tt - 0.5) * 2;
                                r = current[1][0] + (current[2][0] - current[1][0]) * k;
                                g = current[1][1] + (current[2][1] - current[1][1]) * k;
                                b = current[1][2] + (current[2][2] - current[1][2]) * k;
                            }
                            const core = smoothstep(0.78, 0.90, v) * (dark ? 0.35 : 0.22);
                            r += (255 - r) * core;
                            g += (255 - g) * core;
                            b += (255 - b) * core;
                            data[p]     = bR + (r - bR) * a;
                            data[p + 1] = bG + (g - bG) * a;
                            data[p + 2] = bB + (b - bB) * a;
                        } else {
                            data[p] = bR; data[p + 1] = bG; data[p + 2] = bB;
                        }
                        data[p + 3] = 255;
                    }
                }
                ctx.putImageData(img, 0, 0);
                requestAnimationFrame(frame);
            }

            return {
                start: function () {
                    bg = (isDark() ? BG_DARK : BG_LIGHT).slice();
                    requestAnimationFrame(frame);
                },
                setColor: setColor
            };
        })();

        const BG_STYLE = { blur: 6, grain: 0.085, grainLight: 0.18, grainSize: 1.2, grainBlend: 'normal' };

        function grainDataUrl(freq) {
            const svg = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'>" +
                        "<filter id='n'><feTurbulence type='fractalNoise' baseFrequency='" + freq +
                        "' numOctaves='3' stitchTiles='stitch'/></filter>" +
                        "<rect width='100%' height='100%' filter='url(#n)'/></svg>";
            return 'url("data:image/svg+xml,' + encodeURIComponent(svg) + '")';
        }

        function bgStyle(patch) {
            Object.assign(BG_STYLE, patch || {});
            const root = document.documentElement.style;
            root.setProperty('--bg-blur', BG_STYLE.blur + 'px');
            root.setProperty('--bg-grain-dark', BG_STYLE.grain);
            root.setProperty('--bg-grain-light', BG_STYLE.grainLight);
            root.setProperty('--bg-grain-blend', BG_STYLE.grainBlend);
            document.getElementById('bg-grain').style.backgroundImage = grainDataUrl(BG_STYLE.grainSize);
            return BG_STYLE;
        }

        bgStyle();
        blobField.start();
    </script>
</body>
</html>
