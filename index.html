    <!-- CSS BLOB ANIMATIONS, GRADIENTS & NOISE -->
    <style>
        /* This tells the browser how to animate the custom color variable smoothly */
        @property --team-color {
            syntax: '<color>';

            inherits: true;

        :root {
            --team-color: #F97316; 
        }
        
        /* ------------------------------------------------------------------
           ORGANIC BLOB FIELD

           Rendered on a canvas, deliberately NOT with an SVG filter. The
           previous feTurbulence + feDisplacementMap approach worked in Blink,
           but WebKit (iOS Safari) does not produce a transparent result when
           an SVG filter is applied to an HTML element - it painted an opaque
           near-white layer over the whole viewport, which is what hid the
           dark-mode background and flattened the blobs back into circles.

           Instead the field is drawn at a deliberately tiny internal
           resolution and upscaled by CSS. The browser's bilinear smoothing on
           that upscale is what makes the edges soft, and domain-warped value
           noise (noise sampled at coordinates offset by more noise) is what
           makes the shapes tendrilled and amorphous rather than elliptical.
           ------------------------------------------------------------------ */

        #blob-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            /* No opacity here: the canvas is opaque and paints the theme
               background itself, and blob strength is applied per-pixel. */
        }

        /* The bet slip belongs to the traditional feed only. id+class specificity
           beats Tailwind's `flex` display utility, which a plain `hidden` class
           could lose to depending on CDN rule order. */
        #collapsed-slip.slip-hidden { display: none; }

    </style>

        function getFraction(decimal) {
            const profit = decimal - 1;
            if (profit <= 0) return "1/1"; 
            let numerator = Math.round(profit * 100);
            let denominator = 100;
            function gcd(a, b) { return b ? gcd(b, a % b) : a; }
            const commonDivisor = gcd(numerator, denominator);
            return `${numerator / commonDivisor}/${denominator / commonDivisor}`;

        /* ----------------------------------------------------------------
           Canvas blob field. Drawn at a tiny internal resolution (the CSS
           upscale is what softens it) using domain-warped value noise, so the
           shapes come out amorphous instead of elliptical. Replaces an SVG
           feDisplacementMap filter that WebKit/iOS rendered as an opaque
           white sheet over the page.
           ---------------------------------------------------------------- */
        const blobField = (function () {
            const canvas = document.getElementById('blob-canvas');
            const ctx = canvas.getContext('2d');
            const W = 64, H = 132;              // internal grid, upscaled by CSS
            canvas.width = W; canvas.height = H;
            const img = ctx.createImageData(W, H);
            const data = img.data;

            let target = [249, 115, 22];
            let current = [249, 115, 22];

            const BG_LIGHT = [255, 255, 255];
            const BG_DARK = [3, 7, 18];        // Tailwind gray-950, matches body
            let bg = BG_LIGHT.slice();

            // Unsigned shifts throughout: a signed >> here skews the
            // distribution low (mean ~0.22) and the whole field falls below
            // the alpha threshold, rendering nothing.
            function hash(ix, iy) {
                let n = Math.imul(ix, 0x27d4eb2d) ^ Math.imul(iy, 0x165667b1);
                n = Math.imul(n ^ (n >>> 15), 0x2c1b3c6d);
                n = Math.imul(n ^ (n >>> 12), 0x297a2d39);
                n ^= n >>> 15;
                return (n >>> 0) / 4294967296;
            }
            function fade(t) { return t * t * (3 - 2 * t); }
            function noise2(x, y) {
                const ix = Math.floor(x), iy = Math.floor(y);
                const fx = fade(x - ix), fy = fade(y - iy);
                const a = hash(ix, iy), b = hash(ix + 1, iy);
                const c = hash(ix, iy + 1), d = hash(ix + 1, iy + 1);
                return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
            }
            function fbm(x, y) {
                let v = 0, amp = 0.5, f = 1;
                for (let o = 0; o < 4; o++) { v += amp * noise2(x * f, y * f); f *= 2; amp *= 0.5; }
                return v / 0.9375;   // amplitudes sum to 0.9375; renormalise to ~[0,1]
            }
            function smoothstep(e0, e1, x) {
                const t = Math.min(1, Math.max(0, (x - e0) / (e1 - e0)));
                return t * t * (3 - 2 * t);
            }

            function setColor(hex) {
                const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex || '');
                if (m) target = [parseInt(m[1], 16), parseInt(m[2], 16), parseInt(m[3], 16)];
            }

            function isDark() { return document.documentElement.classList.contains('dark'); }

            function frame(ts) {
                const t = ts * 0.00007;
                for (let i = 0; i < 3; i++) current[i] += (target[i] - current[i]) * 0.05;

                // The theme background is painted BY the canvas, not left to the
                // body. iOS Safari would not reliably repaint the propagated
                // canvas background when the `dark` class flipped - this whole
                // region sits behind a full-viewport fixed compositing layer, so
                // it stayed white until switching apps forced a full repaint.
                // Redrawing it here every frame makes going stale impossible.
                const dark = isDark();
                const want = dark ? BG_DARK : BG_LIGHT;
                for (let i = 0; i < 3; i++) bg[i] += (want[i] - bg[i]) * 0.12;
                const bR = bg[0], bG = bg[1], bB = bg[2];
                const strength = dark ? 0.62 : 0.85;   // was the CSS opacity
                const cr = current[0], cg = current[1], cb = current[2];

                let p = 0;
                for (let y = 0; y < H; y++) {
                    const ny = (y / H) * 3.1;
                    for (let x = 0; x < W; x++, p += 4) {
                        const nx = (x / W) * 1.7;
                        // Domain warp: sample noise at coordinates displaced by
                        // more noise. This is what breaks up the round shapes.
                        const wx = fbm(nx * 1.25 + t, ny * 1.25);
                        const wy = fbm(nx * 1.25 + 4.7, ny * 1.25 - t * 0.85);
                        const v = fbm(nx + wx * 1.9 + t * 0.6, ny + wy * 1.9);

                        const a = smoothstep(0.50, 0.74, v) * strength;
                        let r = cr, g = cg, b = cb;
                        if (a > 0) {
                            const core = smoothstep(0.70, 0.82, v);   // bright hotspot
                            r += (255 - cr) * core * 0.75;
                            g += (255 - cg) * core * 0.75;
                            b += (255 - cb) * core * 0.75;
                        }
                        // Composite over the theme background; output is opaque.
                        data[p]     = bR + (r - bR) * a;
                        data[p + 1] = bG + (g - bG) * a;
                        data[p + 2] = bB + (b - bB) * a;
                        data[p + 3] = 255;
                    }
                }
                ctx.putImageData(img, 0, 0);
                requestAnimationFrame(frame);
            }

            return {
                start: function () {
                    // Start at the right theme so a dark load doesn't flash white.
                    bg = (isDark() ? BG_DARK : BG_LIGHT).slice();
                    requestAnimationFrame(frame);
                },
                setColor: setColor
            };
        })();

        function init() {
            renderTabs();
            renderFeeds();
            blobField.start();
            // Only ran on scroll before, so the slip's initial state was never set.
            updateIndicator();
        }

        function renderTabs() {
            const tabsContainer = document.getElementById('sport-tabs');
            tabsContainer.innerHTML = sportsList.map(sport => {
                const isActive = sport === currentSport;
                const baseClass = "sport-tab shrink-0 flex items-center space-x-2 px-6 py-3 font-bold text-sm transition-colors cursor-pointer border-r border-gray-100 dark:border-gray-800";
                const activeClass = isActive ? "bg-brand text-white" : "bg-transparent text-gray-600 dark:text-gray-400";
                // The icon files are black artwork, so inactive tabs need
                // inverting in dark mode or they vanish into the background.
                const iconFilter = isActive ? "brightness-0 invert" : "grayscale opacity-70 dark:invert";
                // 'For You' has no icon-*.svg file, so it uses an inline star
                // rather than requesting a filename that would 404.
                const icon = sport === 'For You'
                    ? `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.3 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8L12 2z"/></svg>`
                    : `<img src="icon-${sport.toLowerCase()}.svg" alt="" class="w-4 h-4 ${iconFilter}">`;
                return `
                    <button onclick="changeSport('${sport}')" class="${baseClass} ${activeClass}">
                        ${icon}
                        <span>${sport}</span>
                    </button>
                `;
            }).join('');
        }

        function changeSport(sport) {
            currentSport = sport;
            renderTabs();
            renderFeeds();
            // Both feeds keep their scroll offset across a re-render, so a new
            // sport would open part-way down the list. Snap both back to the top.
            document.getElementById('tiktok-feed').scrollTop = 0;
            document.getElementById('traditional-feed').scrollTop = 0;
        }

                        document.documentElement.style.setProperty('--team-color', newColor);
                        blobField.setColor(newColor);   // canvas eases toward it
                    }
                });
            }, { threshold: 0.6 });
            
            document.querySelectorAll('.tiktok-card').forEach(card => observer.observe(card));
        }

        function updateIndicator() {
            const wrapper = document.getElementById('feed-wrapper');
            const dotLeft = document.getElementById('dot-left');
            const dotRight = document.getElementById('dot-right');
            const onTraditional = wrapper.scrollLeft > (wrapper.clientWidth / 2);

            // Slip is traditional-feed only; the TikTok cards have their own
            // inline bet button and the bar was crowding it.
            document.getElementById('collapsed-slip').classList.toggle('slip-hidden', !onTraditional);
            // Keep the dots off the slip bar, which only exists on feed two.
            document.getElementById('indicator-dots').style.bottom = onTraditional ? '5rem' : '0.25rem';
            if (!onTraditional) {
                // Don't leave the expanded panel orphaned over the TikTok feed.
                document.getElementById('expanded-slip').classList.add('translate-y-full');
            }

            if (onTraditional) {
                dotLeft.className = "w-1.5 h-1.5 bg-gray-300 dark:bg-gray-700 rounded-full transition-all duration-300";
                dotRight.className = "w-4 h-1.5 bg-brand rounded-full transition-all duration-300";
            } else {
                dotLeft.className = "w-4 h-1.5 bg-brand rounded-full transition-all duration-300";
                dotRight.className = "w-1.5 h-1.5 bg-gray-300 dark:bg-gray-700 rounded-full transition-all duration-300";
            }
        }

        function toggleLike(btn) {
            const isLiked = btn.classList.contains('liked');
            const countSpan = btn.querySelector('.like-count');
            let count = parseInt(countSpan.innerText);
            if (isLiked) {
                btn.classList.remove('liked', 'text-orange-500');
                btn.classList.add('text-gray-400');
                countSpan.innerText = count - 1;
            } else {
                btn.classList.add('liked', 'text-orange-500');
                btn.classList.remove('text-gray-400');
                countSpan.innerText = count + 1;
            }
        }

        function toggleSlip() {
            document.getElementById('expanded-slip').classList.toggle('translate-y-full');
        }

        function placeBet(btn) {
            const id = btn.getAttribute('data-id');
            const matchId = btn.getAttribute('data-match-id');
            const selection = btn.getAttribute('data-selection');
            const match = btn.getAttribute('data-match');
            const odds = parseFloat(btn.getAttribute('data-odds'));

            if (bets.some(b => b.id === id)) {
                removeBet(id);
                return;
            }
            const existingMatchBet = bets.find(b => b.matchId === matchId);
            if (existingMatchBet) {
                removeBet(existingMatchBet.id);
            }

            bets.push({ id, matchId, selection, match, odds });
            document.querySelectorAll(`[data-id="${id}"]`).forEach(el => updateButtonUI(el, true));
            renderSlip();
        }

        function removeBet(id) {
            bets = bets.filter(b => b.id !== id);
            document.querySelectorAll(`[data-id="${id}"]`).forEach(el => updateButtonUI(el, false));
            renderSlip();
        }

        function clearSlip() {
            bets.forEach(bet => {
                document.querySelectorAll(`[data-id="${bet.id}"]`).forEach(el => updateButtonUI(el, false));
            });
            bets = [];
            renderSlip();
            toggleSlip();
        }

        function updateButtonUI(btn, isPlaced) {
            // Marker class, not a sizing class: the layout used to be detected via
            // 'w-14', which broke as soon as the circular button lost its fixed size.
            const isTikTok = btn.classList.contains('bet-btn-tiktok');
            const selectionText = btn.getAttribute('data-selection');
            const oddsValue = getFraction(parseFloat(btn.getAttribute('data-odds')));

            if (isPlaced) {
                btn.classList.add('placed');
                if (isTikTok) {
                    // Same w-full + icon box as the unplaced state so swapping
                    // between them cannot nudge the column sideways.
                    btn.className = "bet-btn bet-btn-tiktok placed text-brand w-full flex flex-col items-center justify-center transition-all";
                    btn.innerHTML = `<svg class="w-11 h-6" viewBox="0 0 131.91 131.05" fill="currentColor" aria-hidden="true"><use href="#icon-tick"/></svg><span class="text-[10px] font-bold mt-1">Placed</span>`;
                } else {
                    btn.className = "bet-btn flex-1 placed bg-brand text-white flex flex-col items-center justify-center h-16 transition-all shadow-md";
                    btn.innerHTML = `<span class="text-[10px] font-bold text-orange-200">${selectionText}</span><span class="text-lg font-black">&#10003;</span>`;
                }
            } else {
                btn.classList.remove('placed');
                if (isTikTok) {
                    btn.className = "bet-btn bet-btn-tiktok text-gray-400 w-full flex flex-col items-center justify-center transition-all";
                    btn.innerHTML = `<svg class="w-11 h-6 bet-icon-inner" viewBox="0 0 588.47 319.03" fill="currentColor" aria-hidden="true"><use href="#icon-bet"/></svg><span class="text-[10px] font-bold mt-1 bet-text-inner">&pound;1 bet</span>`;
                } else {
                    btn.className = "bet-btn flex-1 bg-white/80 dark:bg-gray-800/80 backdrop-blur-sm text-gray-800 dark:text-white flex flex-col items-center justify-center h-16 transition-all border border-gray-100 dark:border-gray-700 shadow-sm";
                    btn.innerHTML = `<span class="text-[10px] font-bold text-gray-400 bet-text-inner">${selectionText}</span><span class="text-lg font-black bet-odds-inner">${oddsValue}</span>`;
                }
            }
        }

        function renderSlip() {
            const container = document.getElementById('slip-bets-container');
            const accaBlock = document.getElementById('acca-block');
            const numBets = bets.length;
            
            let singlesStake = numBets * 1.00;
            let hasAcca = numBets > 1;
            let accaStake = hasAcca ? 1.00 : 0;
            let accaOdds = hasAcca ? bets.reduce((prod, b) => prod * b.odds, 1) : 0;
            let accaReturns = accaOdds * accaStake;
            
            let totalStake = singlesStake + accaStake;
            let totalReturns = (bets.reduce((sum, b) => sum + (b.odds * 1.00), 0)) + accaReturns;

            document.getElementById('collapsed-count').innerText = numBets;
            document.getElementById('expanded-count').innerText = numBets;
            
            const headerText = `&pound;${totalStake.toFixed(2)} &middot; Returns &pound;${totalReturns.toFixed(2)}`;
            document.getElementById('collapsed-returns').innerHTML = headerText;
            document.getElementById('expanded-header-returns').innerHTML = headerText;
            document.getElementById('total-stake-text').innerHTML = `&pound;${totalStake.toFixed(2)}`;
            document.getElementById('place-btn-stake').innerHTML = `&pound;${totalStake.toFixed(2)}`;

            container.innerHTML = bets.map(bet => `
                <div class="flex justify-between items-center py-2 border-b border-gray-50 dark:border-gray-800">
                    <div class="flex-1">
                        <div class="font-bold text-gray-900 dark:text-white">${bet.selection}</div>
                        <div class="text-[10px] text-gray-400 mt-0.5">${bet.match}</div>
                    </div>
                    <div class="text-right flex items-center space-x-3">
                        <div>
                            <div class="font-black text-gray-900 dark:text-white">${getFraction(bet.odds)}</div>
                            <div class="text-[10px] text-gray-400 mt-0.5">&pound;1 stake</div>
                        </div>
                        <button onclick="removeBet('${bet.id}')" class="text-gray-300 dark:text-gray-600 text-lg font-light hover:text-red-400">&times;</button>
                    </div>
                </div>
            `).join('');

            if (hasAcca) {
                accaBlock.classList.remove('hidden');
                accaBlock.classList.add('flex');
                document.getElementById('acca-title').innerText = `${numBets}-fold Accumulator`;
                document.getElementById('acca-odds').innerText = getFraction(accaOdds);
                document.getElementById('acca-returns').innerHTML = `Returns &pound;${accaReturns.toFixed(2)}`;
            } else {
                accaBlock.classList.add('hidden');
                accaBlock.classList.remove('flex');
            }
        }

        init();
    </script>
</body>
</html>
